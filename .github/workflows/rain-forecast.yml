# توقعات الأمطار (NOAA GFS) لـ48 ساعة كأشكال ناعمة، تُنشر ملفًا واحدًا في إصدار ثابت يقرؤه التطبيق.
# تعمل على خادم Linux (مجاني للمستودعات العامة) كل 6 ساعات، دون أي commit.
name: Rain forecast
on:
  schedule:
    - cron: "40 4,10,16,22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install -q numpy scipy eccodes matplotlib shapely
      - name: Build forecast
        run: python3 tools/rain/build_rain.py rain-forecast.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -9 -k rain-forecast.json
          gh release view rain-forecast >/dev/null 2>&1 || gh release create rain-forecast --title "Rain forecast data" --notes "يُحدَّث تلقائيًا كل 6 ساعات من NOAA GFS. بيانات للتطبيق فقط." --latest=false
          gh release upload rain-forecast rain-forecast.json rain-forecast.json.gz rain-forecast-preview.png --clobber
          ls -la rain-forecast*
