# بناء بيانات الطرق الترابية والردميات
name: Dirt Roads Data
on:
  workflow_dispatch:
    inputs:
      step:
        default: probe
permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
      - name: Run
        run: bash tools/dirtroads/${{ inputs.step }}.sh
      - name: Publish release
        if: inputs.step == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dirtroads-v1 >/dev/null 2>&1 || gh release create dirtroads-v1 --title "Samt dirt roads data" --notes "Dirt roads for the Gulf region. Sources: OpenStreetMap contributors (ODbL), Microsoft Road Detections (ODbL)."
          gh release upload dirtroads-v1 out/* --clobber
