# طبقة المدن والقرى والخدمات (OpenStreetMap + GeoNames) تُنشر في docs/data ويقرؤها التطبيق ويحفظها دون إنترنت
name: Build Towns
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Extract from OpenStreetMap (Geofabrik)
        run: |
          # استخراج محلي من ملف Geofabrik (أوثق من خوادم Overpass المزدحمة)
          sudo apt-get install -y -qq osmium-tool >/dev/null
          mkdir -p osm
          curl -sSL --fail -o osm/gcc.osm.pbf https://download.geofabrik.de/asia/gcc-states-latest.osm.pbf
          osmium tags-filter osm/gcc.osm.pbf \
            n/place=city,town,village,hamlet,suburb,neighbourhood,quarter,farm \
            nwr/amenity=hospital,clinic,police,fire_station nwr/healthcare=hospital \
            -o osm/towns.osm.pbf --overwrite
          osmium export osm/towns.osm.pbf -f geojsonseq -o osm/towns.geojsonseq --overwrite
          wc -l osm/towns.geojsonseq
      - name: Download GeoNames
        run: |
          mkdir -p geonames
          for CC in SA AE KW QA BH OM; do
            curl -sS --fail -o "geonames/$CC.zip" "https://download.geonames.org/export/dump/$CC.zip"
            unzip -o -q "geonames/$CC.zip" "$CC.txt" -d geonames
            echo "$CC $(wc -l < geonames/$CC.txt)"
          done
      - name: Build
        run: |
          python3 tools/towns/build_towns.py docs/data/places-towns.geojson osm/towns.geojsonseq -- geonames/*.txt
          python3 -c "import json,sys; n=len(json.load(open('docs/data/places-towns.geojson'))['features']); print(n); sys.exit(0 if n > 5000 else 1)"
          ls -la docs/data/places-towns.geojson; gzip -9 -c docs/data/places-towns.geojson | wc -c
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add docs/data/places-towns.geojson
          git commit -m "تحديث طبقة المدن والقرى والخدمات" || echo "no changes"
          git pull --rebase -q && git push
