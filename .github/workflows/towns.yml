# طبقة المدن والقرى والخدمات (OpenStreetMap + GeoNames) تُنشر في docs/data ويقرؤها التطبيق ويحفظها دون إنترنت
name: Build Towns
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download OpenStreetMap
        run: |
          mkdir -p osm
          for CC in SA AE KW QA BH OM; do
            sed "s/__CC__/$CC/" tools/towns/query.txt > q.txt
            ok=0
            for attempt in 1 2 3 4; do
              for EP in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
                if curl -sS --fail -A "Samt-towns-builder/1.0 (github.com/oalmuqbel-cpu)" --max-time 900 \
                     --data-urlencode "data@q.txt" "$EP" -o "osm/$CC.json" \
                   && python3 -c "import json;json.load(open('osm/$CC.json'))['elements']" 2>/dev/null; then
                  echo "$CC: $(python3 -c "import json;print(len(json.load(open('osm/$CC.json'))['elements']))") from $EP"; ok=1; break 2
                fi
                rm -f "osm/$CC.json"; sleep 30
              done
              sleep 90
            done
            [ $ok = 1 ] || { echo "::error::OSM $CC failed"; exit 1; }
            sleep 15
          done
      - name: Download GeoNames
        run: |
          mkdir -p geonames
          for CC in SA AE KW QA BH OM; do
            curl -sS --fail -o "geonames/$CC.zip" "https://download.geonames.org/export/dump/$CC.zip"
            unzip -o -q "geonames/$CC.zip" "$CC.txt" -d geonames
            echo "$CC $(wc -l < geonames/$CC.txt)"
          done
      - name: Build
        run: |
          python3 tools/towns/build_towns.py docs/data/places-towns.geojson osm/*.json -- geonames/*.txt
          python3 -c "import json,sys; n=len(json.load(open('docs/data/places-towns.geojson'))['features']); print(n); sys.exit(0 if n > 5000 else 1)"
          ls -la docs/data/places-towns.geojson; gzip -9 -c docs/data/places-towns.geojson | wc -c
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add docs/data/places-towns.geojson
          git commit -m "تحديث طبقة المدن والقرى والخدمات" || echo "no changes"
          git pull --rebase -q && git push
