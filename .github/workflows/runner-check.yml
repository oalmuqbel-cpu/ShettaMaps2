# فحص توفر أجهزة macOS وإصدارات Xcode عليها
name: Runner Check
on:
  workflow_dispatch:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: sw_vers; uname -m; ls /Applications | grep Xcode
