# بناء المشروع وتشغيل الاختبارات على جهاز macOS من GitHub (بدون توقيع)
name: Build and Test

on:
  push:
    # البيانات والأدوات لا تحتاج بناء التطبيق
    paths-ignore: ["docs/**", "ci-shots/**", "notes/**", "tools/**", "ci/probe/**", ".github/workflows/rain-forecast.yml", ".github/workflows/probe.yml"]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label"
        default: xcode-27

concurrency:
  group: build-${{ github.ref }}-${{ inputs.runner || 'push' }}
  cancel-in-progress: true

jobs:
  build-test:
    # جهاز واحد فقط: ننتظر حتى يتوفر بدل تشغيل عدة أجهزة بالتوازي (أقل استهلاكًا)
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Select latest Xcode (27 preferred)
        run: |
          # أحدث Xcode متاح (27 أولًا: Apple تشترط SDK الإصدار 27 للرفع ابتداءً من أبريل 2027)
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ShettaMaps2.xcodeproj -scheme ShettaMaps2

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project ShettaMaps2.xcodeproj -scheme ShettaMaps2 \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          UDID=$(python3 ci/pick_simulator.py)
          echo "Simulator: $UDID"
          xcodebuild test -project ShettaMaps2.xcodeproj -scheme ShettaMaps2 \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.runner }}
          path: |
            build.log
            test.log
          if-no-files-found: ignore
